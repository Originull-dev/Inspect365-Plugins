<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>SharePoint permissions explorer</title>
<style>
/* Explorer for the SharePoint permissions report. Colour carries one meaning: rust marks broken inheritance, teal marks
   selection and links, graphite is everything else, including "open to everyone in the organization" (DESIGN.md,
   decided 2026-11-20). Rebuilt 2026-11-20 after the review against Microsoft Learn: access is shown by grant, each
   group's people are in the data once, and Everyone except external users is counted everywhere. */
:root{color-scheme:light;
--sheet:#E9EFED;--sheet-hi:#F4F8F7;--paper:#FFFFFF;--rule:#C6D2CE;--row:#DCE5E2;
--ink:#0C1514;--mute:#4A5B57;--low:#6B7876;--accent:#0A6E60;--flag:#A6402E;
--sans:ui-sans-serif,system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--sheet);color:var(--ink);font:14px/1.5 var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* header */
.page{max-width:1320px;margin:0 auto;padding:26px 24px 64px}
.rh h1{font-size:26px;line-height:1.15;letter-spacing:-.01em;font-weight:700}
.lede{color:var(--mute);margin-top:8px;max-width:88ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:16px;background:var(--paper);border:1px solid var(--rule);border-radius:2px}
.kpi{padding:11px 14px;border-right:1px solid var(--row)}
.kpi:last-child{border-right:0}
.kpi .v{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.1;display:flex;align-items:center;gap:7px}
.kpi .v .ic.b{color:var(--flag)}
.kpi .k{font-size:12px;color:var(--mute);margin-top:3px}
.meta{font-size:12px;color:var(--low);margin-top:8px;max-width:120ch}

/* layout */
.ex{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:16px;margin-top:20px;align-items:start}
.side{background:var(--paper);border:1px solid var(--rule);border-radius:2px;position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column}
.side-top{padding:12px 12px 10px;border-bottom:1px solid var(--row)}
input[type=search]{width:100%;padding:7px 10px;border:1px solid var(--rule);border-radius:2px;background:var(--paper);font-size:13px}
.checks{display:grid;gap:5px;margin-top:9px}
.check{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--ink);cursor:pointer}
.check input{accent-color:var(--accent)}
.kinds{margin-top:10px;padding-bottom:9px;border-bottom:1px solid var(--row)}
.kl{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.check .n{font-family:var(--mono);font-size:11px;color:var(--mute)}
.tbtns{display:flex;gap:10px;margin-top:8px}
.tbtn{font-size:12px;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.key{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:11.5px;color:var(--mute)}
.key span{display:inline-flex;align-items:center;gap:5px}
.key .b{color:var(--flag)}
.key .o{color:var(--ink)}
.tree{overflow:auto;padding:6px 6px 10px;flex:1}
.foot{border-top:1px solid var(--row);padding:8px 12px;font-size:11.5px;color:var(--low)}

/* tree */
.tg{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:10px 6px 4px}
.ti{display:flex;align-items:center;gap:7px;width:100%;padding:4px 6px;border-radius:2px;font-size:13px;line-height:1.35}
.ti:hover{background:var(--sheet-hi)}
.ti[aria-selected=true]{background:var(--sheet);box-shadow:inset 3px 0 0 var(--accent)}
.ti .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.caret{width:14px;height:16px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:var(--low);border-radius:2px}
.caret:hover{color:var(--ink);background:var(--row)}
.caret svg{width:12px;height:12px;stroke-width:2.5;transition:transform .12s}
.caret.open svg{transform:rotate(90deg)}
.k-site .nm{font-weight:650}
.k-site>.ic{color:var(--ink)}
.k-subsite>.ic,.k-lib>.ic{color:var(--mute)}
.k-subsite .nm{font-weight:550}
.k-person>.ic,.k-org>.ic{color:var(--accent)}
.grp{margin-left:13px;padding-left:8px;border-left:1px solid var(--row)}
.bm{display:inline-flex;align-items:center;gap:3px;color:var(--flag);font-family:var(--mono);font-size:11px;font-weight:600;flex:none}
.om{display:inline-flex;align-items:center;color:var(--ink);flex:none}
.om .ic{width:14px;height:14px}
.empty{font-size:12.5px;color:var(--low);font-style:italic;padding:6px}

/* detail pane */
.pane{background:var(--paper);border:1px solid var(--rule);border-radius:2px;padding:18px 24px 30px;min-height:520px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12px;color:var(--mute)}
.crumbs button{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.kind{display:flex;align-items:center;gap:6px;margin-top:14px;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.pane h2{font-size:22px;line-height:1.2;margin-top:4px;font-weight:700;overflow-wrap:anywhere}
.url{display:block;font-family:var(--mono);font-size:11px;color:var(--accent);word-break:break-all;margin-top:3px;text-underline-offset:2px}
.conn{margin-top:14px;padding:11px 14px;border:1px solid var(--rule);border-radius:2px;background:var(--sheet-hi);font-size:13px}
.conn p+p{margin-top:4px}
.conn p{max-width:92ch}
.lk{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:12.5px}
.lk a{color:var(--accent);text-underline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:11.5px;padding:2px 7px;border:1px solid var(--rule);border-radius:2px;color:var(--mute);background:var(--sheet-hi);white-space:nowrap}
.status{margin-top:16px;padding:12px 14px;border:1px solid var(--rule);border-radius:2px;background:var(--sheet-hi)}
.status.own{border-color:var(--flag);background:var(--paper);box-shadow:inset 4px 0 0 var(--flag)}
.sl{display:flex;align-items:center;gap:8px;font-size:14px}
.sl .ic{color:var(--mute)}
.own .sl{color:var(--flag);font-weight:650}
.own .sl .ic{color:var(--flag)}
.sl .go{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.sd{font-size:13px;color:var(--mute);margin-top:6px;max-width:92ch}
.cmp{margin-top:10px;display:grid;grid-template-columns:118px minmax(0,1fr);gap:6px 12px;font-size:13px}
.cmp .ck{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding-top:3px}
.cmp .cv div{padding:1px 0}
.cmp .rem{text-decoration:line-through;color:var(--mute)}
.net{margin-top:8px;font-size:13px;color:var(--ink)}
.orgb{margin-top:14px;padding:11px 14px;border:1px solid var(--ink);border-radius:2px;background:var(--paper)}
.orgb .oh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.orgb p{font-size:12.5px;color:var(--mute);margin-top:4px;max-width:92ch}
.sec{margin-top:24px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1px solid var(--ink);padding-bottom:5px}
.sh h3{font-size:14px;font-weight:700}
.sh .shn{font-size:12px;color:var(--ink);font-weight:600;text-align:right}
/* Who can open it: one block per access level, named once on the left, then each grant and the people it brings
   (decided 2026-11-24). The columns line up from block to block. */
.agh,.agb{display:grid;grid-template-columns:minmax(140px,190px) minmax(0,1fr);column-gap:18px}
.agh{font-size:11.5px;color:var(--mute);padding:9px 0 6px;border-bottom:1px solid var(--row)}
.agb{border-bottom:1px solid var(--rule)}
.agl{padding:10px 0}
.agl b{display:block;font-size:13px;font-weight:650}
.agl span{display:block;font-size:12px;line-height:1.45;color:var(--mute);margin-top:2px}
.gr,.agc{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);column-gap:18px}
.gr{padding:10px 0;font-size:13px;align-items:start}
.gr+.gr{border-top:1px solid var(--row)}
.gn{font-weight:600;overflow-wrap:anywhere}
.gt,.glv{display:block;font-weight:400;font-size:11.5px;color:var(--low)}
.glv{color:var(--mute);margin-top:2px}
.gw{min-width:0;font-size:13px;line-height:1.55}
.gw .glead{font-weight:600}
.gh{font-size:12px;color:var(--mute);margin-top:3px}
.show{font-size:12px;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.nb{margin-top:6px;padding:8px 10px;background:var(--sheet-hi);border:1px solid var(--row);border-radius:2px}
.nb input{max-width:280px;margin-bottom:6px}
.nl{columns:2 250px;font-size:12.5px}
.nl>div{break-inside:avoid;padding:2px 0}
.nl .u{font-family:var(--mono);font-size:10.5px;color:var(--low);margin-left:6px;word-break:break-all}
.fine{font-size:12px;color:var(--low);margin-top:16px;max-width:92ch}
.tag{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-left:6px;white-space:nowrap;color:var(--ink)}
.none{font-size:12.5px;color:var(--low);font-style:italic}
.items{margin-top:4px}
.it{display:grid;grid-template-columns:18px minmax(0,1fr) auto minmax(64px,auto);gap:10px;align-items:center;width:100%;padding:7px 4px;border-bottom:1px solid var(--row);font-size:13px}
button.it:hover{background:var(--sheet-hi)}
.it>.ic{color:var(--mute)}
.it .in{color:var(--low);font-size:12px}
.it .st{font-size:12px;color:var(--mute);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.it .st.b{color:var(--flag);font-weight:600}
.it .pc{font-family:var(--mono);font-size:11.5px;color:var(--ink);text-align:right;white-space:nowrap}
.it.sub{padding-left:22px}
.prs{margin-top:14px}
.prh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;border-bottom:1px solid var(--row);padding-bottom:4px}
.prh .go{font-weight:650;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.prh .acc{font-size:12px;color:var(--mute)}
.tip{position:fixed;z-index:60;max-width:320px;background:var(--paper);border:1px solid var(--rule);border-radius:2px;box-shadow:0 6px 18px rgba(12,21,20,.16);padding:7px 10px;font-size:12px;pointer-events:none}
.tip .tv{font-weight:650;font-size:12.5px}
.tip .tl{color:var(--mute)}
@media (max-width:900px){.ex{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none}.tree{max-height:60vh}}
@media (max-width:560px){.page{padding:20px 16px 56px}.pane{padding:16px}.cmp{grid-template-columns:1fr}.agh{display:none}.agb,.gr{grid-template-columns:1fr}.agl{padding-bottom:0}.gr{row-gap:4px}
  .it{grid-template-columns:18px minmax(0,1fr) auto}.it .pc{grid-column:2/-1;text-align:left;white-space:normal}}
</style>
</head>
<body>
<main class="page" id="main"></main>
<script>/*DATA*/</script>
<script>
(() => {
'use strict';
const SP = window.SP, P = SP.people, G = SP.groups, ME = SP.membersEnabled;
const HOST = ((SP.sites[0] || {}).url || '').replace(/^(https:\/\/[^/]+).*$/, '$1');

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'tip') { el._tip = v; el.dataset.tip = ''; }
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
const nf = n => n.toLocaleString('en-US');
const plural = (n, one, many) => (n === 1 ? one : many || one + 's');
const N = (n, one, many) => `${nf(n)} ${plural(n, one, many)}`;
const NP = n => N(n, 'person', 'people');
const shortUrl = u => (u || '').replace(HOST, '') || '/';
const byName = (a, b) => a.n.localeCompare(b.n, undefined, { sensitivity: 'base' });
const byPid = (a, b) => P[a].n.localeCompare(P[b].n, undefined, { sensitivity: 'base' });

/* icons: one silhouette per kind (globe = site, window = subsite, folder = library), broken link = unique
   permissions, building = everyone in the organization */
const NS = 'http://www.w3.org/2000/svg';
const SHAPES = {
  site: [['circle', { cx: 12, cy: 12, r: 10 }], ['path', { d: 'M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20' }], ['path', { d: 'M2 12h20' }]],
  subsite: [['rect', { x: 2, y: 4, width: 20, height: 16, rx: 2 }], ['path', { d: 'M2 9h20' }], ['path', { d: 'M6 6.5h.01M9 6.5h.01' }]],
  lib: [['path', { d: 'M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z' }]],
  broken: [['path', { d: 'm18.84 12.25 1.72-1.71a5 5 0 0 0-.12-7.07 5 5 0 0 0-6.95 0l-1.72 1.71' }], ['path', { d: 'm5.17 11.75-1.71 1.71a5 5 0 0 0 .12 7.07 5 5 0 0 0 6.95 0l1.71-1.71' }], ['path', { d: 'M8 2v3M2 8h3M16 19v3M19 16h3' }]],
  link: [['path', { d: 'M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71' }], ['path', { d: 'M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71' }]],
  person: [['circle', { cx: 12, cy: 8, r: 4 }], ['path', { d: 'M20 21a8 8 0 0 0-16 0' }]],
  org: [['path', { d: 'M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z' }], ['path', { d: 'M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2' }], ['path', { d: 'M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2' }], ['path', { d: 'M10 6h4M10 10h4M10 14h4M10 18h4' }]],
  chevron: [['path', { d: 'm9 18 6-6-6-6' }]],
};
function icon(name, label, cls) {
  const el = document.createElementNS(NS, 'svg');
  el.setAttribute('viewBox', '0 0 24 24');
  el.setAttribute('class', 'ic' + (cls ? ' ' + cls : ''));
  if (label) { el.setAttribute('role', 'img'); el.setAttribute('aria-label', label); } else el.setAttribute('aria-hidden', 'true');
  for (const [tag, attrs] of SHAPES[name]) {
    const p = document.createElementNS(NS, tag);
    for (const k in attrs) p.setAttribute(k, attrs[k]);
    el.append(p);
  }
  return el;
}
const KIND = { site: 'Site', subsite: 'Subsite', lib: 'Document library', person: 'Person', org: 'Everyone in the organization' };
const ORG = 'Everyone in the organization';

/* data: a web's or library's grants. A row is [kind, name, role, level, tier, note, people, groups, specials, partial]. */
const TIER = { 3: ['Full control', 'Manage the content, settings and who has access'], 2: ['Can edit', 'Add, change and delete files'],
  1: ['Can view', 'View and download files'], 0: ['Level not known', 'No rights are listed for this level'] };
const VERB = { 3: 'has full control', 2: 'can edit', 1: 'can view', 0: 'has access' };
const PLAIN = { 3: 'Full Control', 2: 'Edit', 1: 'Read' };   // the level that says nothing more than its tier
const ACC = {};
function acc(id) {
  if (ACC[id]) return ACC[id];
  const rows = (SP.acc[id] || []).map(r => {
    const all = new Set(r[6]);
    r[7].forEach(g => G[g].m.forEach(p => all.add(p)));
    return { kind: r[0], name: r[1], role: r[2], level: r[3], tier: r[4], note: r[5], pids: r[6], gids: r[7], sp: r[8], partial: !!r[9], all,
      org: r[8].some(x => x[0] === 'org'), every: r[8].some(x => x[0] === 'everyone'), unknown: r[7].filter(g => G[g].x === 2) };
  });
  const people = new Map(), unknown = new Set();
  let org = -1, every = -1, partial = false;
  for (const r of rows) {
    if (r.org) org = Math.max(org, r.tier);
    if (r.every) every = Math.max(every, r.tier);
    partial = partial || r.partial;
    r.unknown.forEach(g => unknown.add(g));
    for (const p of r.all) {
      let e = people.get(p);
      if (!e) people.set(p, (e = { t: 0, lv: [] }));
      e.t = Math.max(e.t, r.tier);
      r.level.split(', ').forEach(l => { if (!e.lv.includes(l)) e.lv.push(l); });
    }
  }
  return (ACC[id] = { rows, people, org, every, partial, unknown: unknown.size });
}
const SITES = SP.sites.slice().sort(byName);
const SITE = new Map(SP.sites.map(s => [s.id, s]));
/* The kinds of site in the file, by what they are connected to, and which the reader has ticked to show (decided 2026-11-23). */
const KINDS = SP.cats.filter(([c]) => SITES.some(s => s.c === c)).map(([c, label]) => [c, label, SITES.filter(s => s.c === c).length]);
const PLURAL = { sp: 'SharePoint-only sites', group: 'Microsoft 365 group sites not in Teams', teams: 'Teams-connected and channel sites' };
const joinAnd = a => (a.length < 3 ? a.join(' and ') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]);
const effId = l => (l.own ? l.id : l.src);
const libAcc = l => acc(effId(l));
const webAcc = (s, w) => acc(w.own ? w.id : w.src || s.root);
const rootLibs = s => s.libs.filter(l => !l.web);
const webLibs = (s, w) => s.libs.filter(l => l.web && l.wid === w.wid);
const broken = s => s.libs.filter(l => l.own).length + s.webs.filter(w => w.own).length;
const siteOrg = s => acc(s.root).org >= 0;
const libOrg = l => libAcc(l).org >= 0;
const groupLabel = g => (g.k === 'm' ? (g.c === 'o' ? 'owners' : 'members') + ' of the Microsoft 365 group ' : g.k === 'r' ? 'Microsoft Entra role ' : 'Microsoft Entra group ') + g.n;
const parentOf = (s, x) => (!x.cmp || x.cmp === s.root ? 'the site' : 'the subsite ' + ((s.webs.find(w => w.id === x.cmp) || {}).n || ''));

/* Who can open it, as a count: everyone in the organization first, then named people, then what the number hides. */
function countText(a, short) {
  const n = a.people.size;
  if (short) {
    const lead = a.org >= 0 ? `Everyone (${nf(ME)})` : a.every >= 0 ? 'Everyone' : '';
    if (lead) return lead + (n ? ` and ${nf(n)} named` : '');
    return (a.partial ? 'at least ' : '') + NP(n);
  }
  const named = `${nf(n)} named ${plural(n, 'person', 'people')}`;
  const head = a.org >= 0 ? `${ORG} (${nf(ME)} accounts)` + (n ? ` and ${named}` : '')
    : a.every >= 0 ? 'Everyone' + (n ? ` and ${named}` : '') : (a.partial ? 'at least ' : '') + NP(n);
  let dis = 0, gone = 0;
  a.people.forEach((_, p) => { if (P[p].d) dis++; if (P[p].x) gone++; });
  const tail = [dis ? `${dis} disabled` : '', gone ? `${gone} not in Entra` : '', a.unknown ? `${N(a.unknown, 'group')} unknown` : '',
    a.partial && (a.org >= 0 || a.every >= 0) ? 'a list is partial' : ''].filter(Boolean);
  return [head].concat(tail).join(', ');
}

/* tooltips: they repeat what the row or pane already says, so nothing depends on them */
const tip = h('div', { class: 'tip', role: 'tooltip' });
tip.hidden = true;
document.body.append(tip);
let tipEl = null;
function showTip(el, x, y) {
  const v = typeof el._tip === 'function' ? el._tip() : el._tip;
  tip.textContent = '';
  v.filter(Boolean).forEach((line, i) => tip.append(h('div', { class: i ? 'tl' : 'tv' }, line)));
  tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let left = x + 14, top = y + 16;
  if (left + r.width > innerWidth - 8) left = x - r.width - 14;
  if (top + r.height > innerHeight - 8) top = y - r.height - 12;
  tip.style.left = Math.max(8, left) + 'px';
  tip.style.top = Math.max(8, top) + 'px';
}
document.addEventListener('pointerover', e => {
  const el = e.target.closest ? e.target.closest('[data-tip]') : null;
  if (el === tipEl) return;

tree.addEventListener('keydown', e => {
  const items = [...tree.querySelectorAll('[role=treeitem]')];

  const to = el => { if (!el) return; items.forEach(x => (x.tabIndex = -1)); el.tabIndex = 0; el.focus(); el.scrollIntoView({ block: 'nearest' }); };

  else if (e.key === 'ArrowUp') { e.preventDefault(); to(items[i - 1]); }
  else if (e.key === 'Home') { e.preventDefault(); to(items[0]); }

function firstSel() {
  const v = vis(), s = v.find(x => broken(x)) || v[0];

  return s ? { t: 'site', s: s.id } : { t: 'org' };
}
function select(x) {
  sel = x;
  const id = x.t === 'site' ? 'S:' + x.s : x.t === 'web' ? 'W:' + x.w : x.t === 'lib' ? 'L:' + x.l : x.t === 'org' ? 'O' : 'P:' + x.p;
  if (x.s) open.add(x.s);
  if (x.w) shut.delete(x.w);
  renderTree(id);
  renderPane();
  const b = tree.querySelector('[aria-selected="true"]');
  if (b) b.scrollIntoView({ block: 'nearest' });
}

/* detail pane */
function crumbs(parts) {

}
function headBlock(kind, name, url, chips, sub) {

function renderPane() {
  pane.textContent = '';

  if (sel.t === 'org') { pane.append(crumbs([home, { n: ORG }]), orgPane()); return; }
  const s = SITE.get(sel.s);
  const toSite = { n: s.n, go: () => select({ t: 'site', s: s.id }) };
  if (sel.t === 'site') { pane.append(crumbs([home, { n: s.n }]), sitePane(s)); return; }
  if (sel.t === 'web') { const w = s.webs.find(x => x.id === sel.w); pane.append(crumbs([home, toSite, { n: w.n }]), webPane(s, w)); return; }

  pane.append(crumbs([home, toSite, w ? { n: w.n, go: () => select({ t: 'web', s: s.id, w: w.id }) } : null, { n: l.n }].filter(Boolean)), libPane(s, l, w));

function libPane(s, l, w) {

  const summary = h('div', { class: 'status' + (nb ? ' own' : '') },

/* What the site is connected to and where its access is managed, with links out (decided 2026-11-20). */
const ext = (href, text) => h('a', { href, target: '_blank', rel: 'noopener' }, text);

function orgPane() {

    h('div', { class: 'status' }, h('div', { class: 'sl' }, icon('org'), `Can open ${N(libs, 'document library', 'document libraries')} and ${N(sites, 'site')}`),

function personPane(pid) {
  const p = P[pid];

    const site = acc(s.root).people.get(pid);

  const more = extra.reduce((n, x) => n + x.own.length, 0);

  return h('div', {}, headBlock('person', p.n, null, [p.u, p.g ? 'Guest' : null, p.d ? 'Disabled' : null, p.x ? 'Not in Entra' : null].filter(Boolean)),
    SP.msp && p.iu ? h('div', { class: 'lk' }, ext(p.iu, 'Open in ' + SP.vendor)) : null,
    h('div', { class: 'status' }, h('div', { class: 'sl' }, icon('person'), `Can open ${N(total, 'document library', 'document libraries')} on ${N(sites, 'site')}`),
      h('p', { class: 'sd' }, `${nf(named.size)} by name or through a group` + (member ? `, and ${nf(more)} more because they are open to everyone in the organization.` : '. Guests are not part of Everyone except external users, so nothing is added for that.')

        h('div', { class: 'prh' }, h('button', { class: 'go', onclick: () => select({ t: 'site', s: x.s.id }) }, x.s.n)),
